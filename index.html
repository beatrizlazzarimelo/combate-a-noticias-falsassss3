<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combate a Notícias Falsas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-glow"></div>

    <main class="app">
      <header class="topbar">
        <span class="brand">Combate a Notícias Falsas</span>
      </header>

      <section id="start-screen" class="screen active">
        <div class="intro-box">
          <p class="eyebrow">Seleção de personagem</p>
          <h1>Escolha seu herói na mansão do algoritmo</h1>
          <p class="lead">
            A casa respira rumor, os vídeos têm olhos, e a desinformação está se
            espalhando como uma infecção. Cada personagem entra em uma rota
            diferente da luta contra as notícias falsas.
          </p>
        </div>

        <div id="character-grid" class="character-grid"></div>
      </section>

      <section id="story-screen" class="screen hidden">
        <div id="path-meta" class="path-meta"></div>
        <div id="story-panel" class="story-panel"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
